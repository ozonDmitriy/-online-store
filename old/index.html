<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Shoppe</title>
    <link rel="stylesheet" href="/src/styles/style.css" />
    <link rel="icon" type="image/png" href="./src/images/SH.png">
  </head>
  <body class="home-page">
    <div class="overlay"></div>
    <header class="header">
      <div class ="header__message">
        <div class="header__message-left">
          <img class="header__message-res" src="./src/images/iconsuccess.svg"/>
          <p class="header__message-title"></p>
        </div> 
        <!-- <button class="header__message-button"> VIEW CART</button> -->
      </div>
      <a class="header__logo" href="/">SHOPPE</a>
      <div class="header__right">
        <nav class="header__menu">
          <ul class="header__menu-list">
            <li class="header__menu-item">
              <a class="header__menu-link" href="./src/pages/catalog.html"
                >Shop</a
              >
              <span class="header__menu-separator">|</span>
            </li>
          </ul>
        </nav>
        <div class="header__actions">

          <label for="cart-toggle" class="header__logo-shoping-cart--button" href="/">
            <img src="./src/images/Group 77.svg" alt="корзина" />
            <div class="header__shop-count">1</div>
          </label>
          
          <a class="header__logo-man-button" href="/">
            <img src="./src/images/Iconman.svg" alt="">
          </a>
          <button
              class="header__mobile-menu"

            >
              <img src="./src/images/menumobile.svg" alt="меню" />
          </button>
          <div class="header__basket">
            <div class="header__basket-mobile-header">
              <img class="backtopage" src="./src/images/backtopage.svg" alt="Back"/>
              <p class="header__basket-name">Shopping bag</p>
            </div>
              <!-- <img class="backtopage" src="./src/images/backtopage.svg" alt="Back"/>
              <p class="header__basket-name">Shopping bag</p> -->
              <p class="header__basket-count">0 items</p>
              <div class="header__basket-items"></div>
              <div class="header__basket-conteiner template" style="display:none">
                <img class="header__backet-cart" src="../images/bagimage.png" />
                <div class="header__basket-textcontent">
                  <p class="header__basket-title">Hair Pin Set of 3</p>
                  <p class="header__basket-color">Black / Medium</p>
                  <p class="header__basket-cost">$20,00</p>

                  <div class="header__basket-counter">
                    <p class="header__basket-counter-name">QTY:</p>
                    <p class="header__basket-counter-name-minus">-</p>
                    <p class="header__basket-counter-name-count">3</p>
                    <p class="header__basket-counter-name-plus">+</p>
                  </div>
            

                </div>
                
              <div class="header__basket-close">
                <img src="./src/images/crest.svg">
              </div>
              </div> 
              <div class="header__basket-end">
                <hr class="header__basket-line"/>
                <div class="header__basket-total">
                  <p class="header__basket-totalCount">Subtotal (0 items)</p>
                  <p class="header__basket-totalCost"> $ 0.00 </p>
                </div>
                <div class="header__basket-button">
                  <button class="header__basket-button-view"> VIEW CART</button>
                </div>
              </div>
             


            </div>
        </div>
      </div>
    </header>
    <main class="promos">
      <div class="swiper-promos">
        <div class="swiper-wrapper">
          <div class="swiper-slide">
      
          
          </div>
        </div>

        <div class="swiper-pagination"></div>
        <div class="swiper-button-prev"></div>
        <div class="swiper-button-next"></div>
      </div>

      <div class="store__goods">
        <span class="store__goods-logo">Shop The Latest</span>
        <a class="store__view-all-store" href="./src/pages/catalog.html">View All</a>
      </div>
      <div class="goods">
        <div class="goods__item goods-template">
          <div class="goods__sale">
            <p class="goods__discount" >- 31 %</p>
          </div>
          <img src="./src/images/goods1.png" alt="Серьги Lira Earrings" />
          <button class="goods-catalog__mobile-button">ADD TO CART</button>
          <div class="goods__icons">
            <a href="/">

              </svg>
            </a>

            <a href="/"
              ><img
                class="goods__link-icons-second"
                src="./src/images/eye-svgrepo-com 1.svg"
                alt="Глаз"
            /></a>
            <a href="/"
              ><img
                class="goods__link-icons-third"
                src="./src/images/heart-icon 1.svg"
                alt="Сердце"
            /></a>
          </div>
          <p class="goods__title">Lira Earrings</p>
          <p class="goods__price">
            <s class="goods__sale-price">$ 29,00  </s>
            $ 20,00
          </p>
        </div>

       
      </div>
    </main>
    <footer class="footer">
      <hr class="footer__line-footer" />
      <div class="footer__business-name-footer">
        <div class="footer__social-media-mobile">
          <a class="In" href="/"><img src="./src/images/instagram.svg" alt="In"></a>
          <a class="Facebook" href="/"><img src="./src/images/facebook.svg" alt="facebook"></a>
          <a class="Instagram" href="/"><img src="./src/images/realinst.svg" alt="Instagram"></a>
          <a class="Twitter" href="/"><img src="./src/images/twitter.svg" alt="Twitter"></a>
        </div>
        <a class="footer__data-name-link" href="/">© 2025 Shelly</a>
        <div class="footer__social-media">
          <a class="In" href="/"><img src="./src/images/instagram.svg" alt="In"></a>
          <a class="Facebook" href="/"><img src="./src/images/facebook.svg" alt="facebook"></a>
          <a class="Instagram" href="/"><img src="./src/images/realinst.svg" alt="Instagram"></a>
          <a class="Twitter" href="/"><img src="./src/images/twitter.svg" alt="Twitter"></a>
        </div>
      </div>
    </footer>
    <script src="./src/scripts/cartonpage.js" type="module"></script>
    <script src="./src/scripts/basket.js" type="module"></script>
    <script type="module" src="./src/scripts/slider.js"></script>
  </body>
</html>
